name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Install Godot 4.7.2 and templates
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo install Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. ~/.local/share/godot/export_templates/4.7.2.stable/
          godot --version
      - name: Configure signing and Godot Android paths
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ~/.config/godot build_support
          if [ ! -f build_support/debug.keystore ]; then
            keytool -genkeypair -keystore build_support/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=World Defense,C=TR"
          fi
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Import and parse project
        run: godot --headless --editor --path . --import --quit
      - name: Export and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          godot --headless --path . --export-debug Android build/World-Defense.apk
          test -s build/World-Defense.apk
          test "$(stat -c '%s' build/World-Defense.apk)" -gt 10000000
          unzip -t build/World-Defense.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs build/World-Defense.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging build/World-Defense.apk | tee build/BADGING.txt
          sha256sum build/World-Defense.apk | tee build/SHA256.txt
          stat -c '%s' build/World-Defense.apk | tee build/SIZE_BYTES.txt
          file build/World-Defense.apk
          ls -lh build/World-Defense.apk
      - uses: actions/upload-artifact@v4
        with:
          name: World-Defense-APK
          path: build/
          if-no-files-found: error
          retention-days: 30
