name: Build Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Godot 4.5.1 and templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          sudo install Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.5.1.stable
          unzip -q Godot_v4.5.1-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.5.1.stable/
      - name: Configure Godot Android paths
        run: |
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.5.tres
      - name: Import and parse project
        run: godot --headless --editor --path . --quit
      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/World-Defense.apk
          test -s build/World-Defense.apk
          unzip -t build/World-Defense.apk
          sha256sum build/World-Defense.apk > build/SHA256.txt
          stat -c '%s' build/World-Defense.apk > build/SIZE_BYTES.txt
          ls -lh build/World-Defense.apk
      - uses: actions/upload-artifact@v4
        with:
          name: World-Defense-APK
          path: build/
          if-no-files-found: error
